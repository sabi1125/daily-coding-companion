services:
  mysql:
    image: mysql:8.4
    container_name: dcc_msql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-daily_coding_companion}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    container_name: dcc_backend
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
    environment:
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-daily_coding_companion}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      piston:
        condition: service_healthy
    networks:
      - default
      - dcc_network

  frontend:
    image: node:22-alpine
    container_name: dcc_frontend
    working_dir: /app
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: piston_container
    restart: always
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston_packages:/piston/packages
      - tmpfs_exec:/tmp:exec
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2000/api/v2/runtimes',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 5
    networks:
      - dcc_network

  piston_installer:
    image: alpine:latest
    container_name: piston_installer
    depends_on:
      piston:
        condition: service_healthy
    volumes:
      - ./scripts:/app/scripts
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache curl &&
      chmod +x /app/scripts/piston_runtimes_install.sh &&
      /app/scripts/piston_runtimes_install.sh
      "
    networks:
      - dcc_network

volumes:
  mysql_data:
  piston_packages:
  tmpfs_exec:
  frontend_node_modules:

networks:
  dcc_network:
    driver: bridge
