services:
  mysql:
    image: mysql:8.4
    container_name: dcc_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-daily_coding_companion}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    container_name: dcc_backend
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
    environment:
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-daily_coding_companion}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default
      - dcc_network

  frontend:
    image: node:22-alpine
    container_name: dcc_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mysql_data:
  frontend_node_modules:

networks:
  dcc_network:
    driver: bridge
